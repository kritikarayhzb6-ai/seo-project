<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Video and motion graphics production</title>
  <desc id="desc">A cinematic editing frame with a play button, motion trails, color swatches, and a video timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101719"/>
      <stop offset="0.55" stop-color="#27362f"/>
      <stop offset="1" stop-color="#3b342a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#304b45"/>
      <stop offset="1" stop-color="#182226"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6a83b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d6a83b" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f2d27b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <circle cx="1250" cy="130" r="220" fill="#d6a83b" opacity=".06"/>
  <circle cx="240" cy="900" r="300" fill="#70b89a" opacity=".08"/>
  <path d="M0 790 C270 650 390 880 690 730 S1190 610 1536 770" fill="none" stroke="#9bbf78" stroke-opacity=".18" stroke-width="3"/>
  <g filter="url(#shadow)">
    <rect x="180" y="125" width="1176" height="650" rx="22" fill="#11191b" stroke="#d6a83b" stroke-opacity=".55" stroke-width="4"/>
    <rect x="220" y="165" width="1096" height="520" rx="10" fill="url(#screen)"/>
    <path d="M220 560 C370 470 470 590 620 500 S900 350 1060 460 S1220 500 1316 390 V685 H220Z" fill="#203b36" opacity=".75"/>
    <path d="M220 555 C420 470 540 590 715 475 S1050 300 1316 400" fill="none" stroke="#9bbf78" stroke-width="7" stroke-linecap="round" opacity=".82"/>
    <circle cx="768" cy="420" r="92" fill="#d6a83b"/>
    <circle cx="768" cy="420" r="76" fill="#182226"/>
    <path d="M746 378 L746 462 L816 420 Z" fill="#f6f1e7"/>
    <rect x="220" y="165" width="1096" height="42" rx="10" fill="#0b1113"/>
    <circle cx="250" cy="186" r="7" fill="#d66b50"/>
    <circle cx="275" cy="186" r="7" fill="#d6a83b"/>
    <circle cx="300" cy="186" r="7" fill="#70b89a"/>
    <text x="1230" y="191" fill="#f6f1e7" font-family="Sora, sans-serif" font-size="18" text-anchor="end" opacity=".72">EDIT / MOTION</text>
  </g>
  <g opacity=".9">
    <path d="M940 280 L1220 220" stroke="url(#trail)" stroke-width="10" stroke-linecap="round"/>
    <path d="M980 315 L1260 255" stroke="url(#trail)" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    <path d="M1030 350 L1290 295" stroke="url(#trail)" stroke-width="3" stroke-linecap="round" opacity=".4"/>
    <rect x="1125" y="790" width="190" height="55" rx="8" fill="#d6a83b"/>
    <rect x="1138" y="803" width="45" height="29" rx="4" fill="#182226"/>
    <path d="M1200 810 H1285 M1200 824 H1255" stroke="#182226" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="190" y="805" width="875" height="100" rx="12" fill="#11191b" stroke="#70b89a" stroke-opacity=".65" stroke-width="3"/>
    <rect x="225" y="837" width="285" height="30" rx="5" fill="#d66b50"/>
    <rect x="520" y="837" width="250" height="30" rx="5" fill="#70b89a"/>
    <rect x="780" y="837" width="245" height="30" rx="5" fill="#d6a83b"/>
    <path d="M225 825 H1025" stroke="#f6f1e7" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 14"/>
    <circle cx="550" cy="820" r="7" fill="#f6f1e7"/>
  </g>
  <text x="190" y="970" fill="#f6f1e7" font-family="Sora, sans-serif" font-size="25" letter-spacing="5" opacity=".78">STORY / RHYTHM / IMPACT</text>
</svg>
